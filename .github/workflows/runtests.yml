# https://github.com/julia-actions/julia-runtest
name: Run tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12', '1']
        julia-arch: [x64]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Install capnp (Linux)
        if: runner.os == 'Linux'
        run: |
          # Build capnproto 1.3.0 from source (apt-get provides 1.0.1 which is too old)
          curl -L https://capnproto.org/capnproto-c++-1.3.0.tar.gz -o capnproto.tar.gz
          tar xzf capnproto.tar.gz
          cd capnproto-c++-1.3.0
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          capnp --version

      - name: Install capnp (macOS)
        if: runner.os == 'macOS'
        run: |
          # Homebrew provides capnp 1.3.0
          brew install capnp
          capnp --version

      - name: Install capnp (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install capnproto -y
          capnp --version

      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
