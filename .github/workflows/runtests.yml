name: Run tests

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia-version: '1.10'
            os: ubuntu-latest
          - julia-version: '1'
            os: ubuntu-latest
          - julia-version: '1'
            os: macos-latest
          - julia-version: '1'
            os: windows-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2

      - name: Install Cap'n Proto (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --show-error --location \
            https://capnproto.org/capnproto-c++-1.3.0.tar.gz \
            --output capnproto.tar.gz
          tar xzf capnproto.tar.gz
          cd capnproto-c++-1.3.0
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          capnp --version

      - name: Install Cap'n Proto (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install capnp
          capnp --version

      - name: Install Cap'n Proto (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install capnproto -y
          capnp --version

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1

      - name: Process coverage
        if: runner.os == 'Linux' && matrix.julia-version == '1'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
      - name: Upload coverage
        if: runner.os == 'Linux' && matrix.julia-version == '1'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: lcov.info
          fail_ci_if_error: false
