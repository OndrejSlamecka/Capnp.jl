name: Format check

on:
  push:
    branches:
      - main
      - 'release-*'
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
          arch: x64
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.12.4"))'
      - name: Check formatting
        run: |
          julia -e 'using JuliaFormatter; format(".", verbose=true)'
          git diff --exit-code
